<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qubix Function Quest</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050b24; }
    body { display: grid; place-items: center; font-family: Arial, sans-serif; }
    canvas {
      display: block;
      height: min(100vh, 177.777vw);
      width: min(100vw, 56.25vh);
      background: #071232;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="film" width="1080" height="1920" aria-label="Qubix Function Quest video"></canvas>
  <script type="module" src="./story.js"></script>
</body>
</html>
